<!DOCTYPE html>

<html>
    <head>
        <title>Tev</title>
        <link rel="stylesheet" href="style.css">
        <link rel="icon" type="image/png" href="../Resources/Favicon.png">
    </head>

    <body>
        <section id="authentication">
            <div class="logo"><img src="../Resources/Favicon.png" style="width: 50px; height: 50px;"><h1>Tev</h1></div>

            <input type="text" id="authusername" placeholder="Username">
            <input type="password" id="authpassword" placeholder="Password">
            <p id="authenticationstatus"></p>

            <button onclick="loginUser()">Log In</button>
            <button onclick="registerUser()">Sign Up</button>
        </section>

        <section id="main" style="display: none;">
            <div id="sidebar">
                <div class="logo"><img src="../Resources/Favicon.png" style="width: 50px; height: 50px;"><h1>Tev (BETA)</h1></div>

                <button id="new-chat">New Chat</button>
                <button id="connect-project">Connect Project</button>

                <p>Chats</p>
                <div id="chats" class="scroll-view"></div>

                <p>Projects</p>
                <div id="projects" class="scroll-view"></div>

                <div id="accountoptions">
                    <h3 id="accountname"></h3>
                    <button id="help-button" onclick="switchPage('help', 'main')">Help</button>
                    <button id="logout-button" onclick="logoutUser()">Log Out</button>
                </div>
            </div>

            <div id="message-area" class="scroll-view">
                <div id="messages">
                    <h1 id="prechatmessage"></h1>
                </div>
                
                <div id="mention-warning" style="display: none;"></div>
                <div id="messaging-elements">
                    <div id="input-wrapper">
                        <div id="mention-suggestions"></div>
                        <div id="input-backdrop"></div>
                        <textarea id="message-input" placeholder="Message Tev..." rows="1"></textarea>
                    </div>
                    
                    <button id="send-button" onclick="sendMessage()">Send</button>
                </div>
            </div>

            <script src="script.js"></script>
        </section>

        <section id="help" style="display: none;">
            <h1>CONTROLS</h1>
            <p>Esc - Close app</p>

            <h1>COMMANDS</h1>
            <p>@[file/folder] - Mentions a file or folder in the prompt (FOR PROJECTS)</p>
            <p>~[file/folder] - Excludes a file or folder in the prompt (FOR PROJECTS)</p>
            <p>@. - Mentions all files folders in the prompt excluding '~' (FOR PROJECTS)</p>

            <button id="logout-button" onclick="switchPage('main', 'help')">Back</button>
        </section>
    </body>
</html>
